[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manta"
version = "1.0.0"
description = "Manta CLI — unified interface for all Manta tools with pipe chain support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
manta = "manta:cli"

[tool.setuptools]
py-modules = ["manta"]
